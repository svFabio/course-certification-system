name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # -------------------------------------------------------------
  # 1. Calidad y Estilo de Código (Determinista y ultrarrápido)
  # -------------------------------------------------------------
  code-style:
    name: Code Style (Laravel Pint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint Check
        run: ./vendor/bin/pint --test

  # -------------------------------------------------------------
  # 2. Pruebas Automatizadas con Base de Datos Real (PostgreSQL)
  # -------------------------------------------------------------
  tests:
    name: Automated Tests (Pest PHP & PostgreSQL)
    runs-on: ubuntu-latest
    needs: [code-style]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: plataforma_formacion_testing
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: plataforma_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pdo, pdo_pgsql, pgsql, gd, zip
          coverage: none
          tools: composer:v2

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env.testing
          sed -i 's/DB_HOST=postgres/DB_HOST=127.0.0.1/' .env.testing
          sed -i 's/DB_DATABASE=plataforma_formacion/DB_DATABASE=plataforma_formacion_testing/' .env.testing
          php artisan key:generate --env=testing

      - name: Run Migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: plataforma_formacion_testing
          DB_USERNAME: plataforma
          DB_PASSWORD: plataforma_secret
        run: php artisan migrate --force --env=testing

      - name: Execute Pest Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: plataforma_formacion_testing
          DB_USERNAME: plataforma
          DB_PASSWORD: plataforma_secret
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
        run: ./vendor/bin/pest

  # -------------------------------------------------------------
  # 3. Auditoría de Secretos (Zero Secrets Policy)
  # -------------------------------------------------------------
  security:
    name: Secret Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified
