services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: plataforma_formacion
      POSTGRES_USER: plataforma
      POSTGRES_PASSWORD: plataforma_secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plataforma -d plataforma_formacion"]
      interval: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8000:80'
    volumes:
      - .:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: plataforma_formacion
      DB_USERNAME: plataforma
      DB_PASSWORD: plataforma_secret

volumes:
  pgdata:
